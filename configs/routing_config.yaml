# KahnemanGuard Configuration & Routing Profiles
# NOTE: Absolute paths are configured in the .env file.
# Values with ${VAR} syntax are resolved at runtime via src.core.config.settings.
system:
  project_name: "KahnemanGuard"
  version: "1.0.0"
  author: "Wilson Pham (Pham Ngoc Son)"
  institution: "University of Information Technology (VNU-HCM)"

hub:
  hub_dir: "${HUB_DIR}"

routing:
  default_mode: "${DEFAULT_ROUTING_MODE}" # options: "fast_only", "slow_only", "dual_process"
  default_variant: "${DEFAULT_VARIANT}"   # options: "dense", "diffusion", "diffusion-rlcd"
  
  # Dual-threshold confidence routing boundaries
  tau_safe: ${ROUTER_TAU_SAFE}
  tau_unsafe: ${ROUTER_TAU_UNSAFE}

models:
  tier1:
    dense:
      name: "ModernBERT-large Dense"
      head: "2-layer MLP Classifier (1024 -> 256 -> 2)"
      temperature: ${DENSE_TEMPERATURE}
      tau_confidence: ${ROUTER_TAU_SAFE}
      subpath: "dense_guard/kahnemanguard_modernbert_int8.onnx"
      onnx_model_path: "${DENSE_ONNX_PATH}"
      tokenizer_id: "${DENSE_TOKENIZER_ID}"
      expected_p50_latency_ms: 57.3
      expected_system1_rate_pct: 95.2

    diffusion:
      name: "ModernBERT-large Discrete Diffusion (djev)"
      head: "Constrained Vocab MLM Unembedding"
      temperature: ${DIFFUSION_TEMPERATURE}
      tau_confidence: ${ROUTER_TAU_SAFE}
      subpath: "diff_guard/kahnemanguard_diffusion_int8.onnx"
      onnx_model_path: "${DIFFUSION_ONNX_PATH}"
      tokenizer_id: "${DIFFUSION_TOKENIZER_ID}"
      expected_p50_latency_ms: 93.4
      expected_system1_rate_pct: 67.2

    diffusion_rlcd:
      name: "ModernBERT-large Diffusion + RLCD"
      head: "Constrained Vocab MLM Unembedding + Policy Gradient"
      temperature: ${DIFFUSION_RLCD_TEMPERATURE}
      tau_confidence: ${ROUTER_TAU_SAFE}
      subpath: "diff_rlcd_guard/kahnemanguard_diffusion_rlcd_int8.onnx"
      onnx_model_path: "${DIFFUSION_RLCD_ONNX_PATH}"
      tokenizer_id: "${DIFFUSION_RLCD_TOKENIZER_ID}"
      expected_p50_latency_ms: 81.2
      expected_system1_rate_pct: 94.8

  tier2:
    llama_guard_3_1b:
      name: "Llama-Guard-3-1B"
      runtime: "llama-server (Vulkan GGUF)"
      gguf_path: "${TIER2_GGUF_PATH}"
      endpoint: "${TIER2_URL}${TIER2_ENDPOINT}"
      expected_latency_ms: 1380.0

benchmarks:
  cache_dir: "${BENCHMARK_CACHE_DIR}"
  datasets:
    jailbreakbench: "${DATASET_JAILBREAKBENCH}"
    toxicchat_test: "${DATASET_TOXICCHAT}"
    beavertails_test: "${DATASET_BEAVERTAILS}"
    xstest_benign: "${DATASET_XSTEST}"
